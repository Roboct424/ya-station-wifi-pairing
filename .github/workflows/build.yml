name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller cryptography numpy

      # Звук играет системный плеер (winsound / paplay / aplay / afplay),
      # поэтому libportaudio2 и sounddevice больше не нужны.

      - name: Self-test
        run: |
          python tools/test_frame.py
          python tools/test_ap_wifi.py

      - name: Build CLI
        run: >
          python -m PyInstaller --noconfirm --onefile
          --name StationPairing
          --distpath dist --workpath build --specpath build
          tools/station_pairing.py

      - name: Build GUI
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name StationPairingGUI
          --distpath dist --workpath build --specpath build
          tools/station_pairing_gui.py

      - name: Rename Linux binaries
        if: runner.os == 'Linux'
        run: |
          cd dist
          mv -f StationPairing StationPairing-linux-x86_64
          mv -f StationPairingGUI StationPairingGUI-linux-x86_64
          chmod +x StationPairing-*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StationPairing-${{ runner.os }}
          path: dist/StationPairing*
          if-no-files-found: error

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Android tools
        run: python android/fetch_tools.py

      - name: Build APK
        run: powershell -NoProfile -ExecutionPolicy Bypass -File android/build_apk.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StationPairing-apk
          path: android/StationPairing.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
